<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DJAT Quote v2 - Working!</title>
  <link rel="stylesheet" href="src/styles/globals.css">
</head>
<body style="padding: 40px; background: #0f0f0f; color: #fff; font-family: Vazirmatn, sans-serif;">
  <h1 class="gradient-text" style="text-align: center; font-size: 36px; margin-bottom: 40px;">
    🎉 3DJAT Quote v2 - CSS WORKS!
  </h1>
  
  <div style="max-width: 600px; margin: 0 auto;">
    <div class="card" style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 16px;">✅ If you see green buttons below, CSS is working!</h2>
      
      <button class="btn-primary" style="margin-right: 10px;">Primary</button>
      <button class="btn-secondary" style="margin-right: 10px;">Secondary</button>
      <button class="btn-ghost">Ghost</button>
    </div>
    
    <div class="card" style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 16px;">Input Test</h2>
      <input type="text" class="input" placeholder="Test input..." style="margin-bottom: 10px;">
      <select class="select">
        <option>PLA Black</option>
        <option>PLA Orange</option>
      </select>
    </div>
    
    <div class="card">
      <h2 style="margin-bottom: 16px;">Slider & Spinner</h2>
      <input type="range" class="slider" min="0" max="100" value="50" style="width: 100%; margin-bottom: 20px;">
      <div class="spinner"></div>
    </div>
  </div>
  
  <p style="text-align: center; margin-top: 40px; color: #a0a0a0;">
    If all elements look styled ✅ - You're ready to go!
  </p>
</body>
</html>
