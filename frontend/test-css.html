<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DJAT Quote v2 - Test</title>
  <link rel="stylesheet" href="src/styles/globals.css">
  <style>
    body {
      padding: 40px;
    }
    .test-card {
      max-width: 600px;
      margin: 40px auto;
    }
    .test-btn {
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1 class="gradient-text" style="text-align: center; margin-bottom: 40px;">🎉 3DJAT Quote v2 - CSS Test</h1>
  
  <div class="card test-card">
    <h2 style="margin-bottom: 20px;">Button Test</h2>
    <button class="btn-primary">Primary Button</button>
    <button class="btn-secondary">Secondary Button</button>
    <button class="btn-ghost">Ghost Button</button>
  </div>
  
  <div class="card test-card">
    <h2 style="margin-bottom: 20px;">Input Test</h2>
    <input type="text" class="input" placeholder="Test input..." style="margin-bottom: 10px;">
    <select class="select">
      <option>Material 1</option>
      <option>Material 2</option>
    </select>
  </div>
  
  <div class="card test-card">
    <h2 style="margin-bottom: 20px;">Slider Test</h2>
    <input type="range" class="slider" min="0" max="100" value="50">
  </div>
  
  <div class="card test-card">
    <h2 style="margin-bottom: 20px;">Spinner Test</h2>
    <div class="spinner"></div>
  </div>
  
  <p style="text-align: center; margin-top: 40px; color: var(--text-secondary);">
    If you see green buttons and styled inputs, CSS is working! ✅
  </p>
</body>
</html>
